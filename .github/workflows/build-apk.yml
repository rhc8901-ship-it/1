name: Build RC Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run voice engine tests (build stops if any test fails)
        run: |
          node tests/nlu-quick.js
          node tests/va-tests.js

      - name: Prepare web assets and bundle native voice bridge
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png va-*.js www/
          if [ -f icon-maskable-512.png ]; then cp icon-maskable-512.png www/; fi
          npm run build:voice

      - name: Add Android platform
        run: npx cap add android

      - name: Patch generated AndroidManifest (speech services + microphone)
        run: node scripts/patch-android-manifest.js

      - name: Generate Android launcher icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#06080e' --iconBackgroundColorDark '#06080e' --splashBackgroundColor '#06080e' --splashBackgroundColorDark '#06080e'

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Verify speech plugins and web files
        run: |
          npm ls @capacitor-community/speech-recognition --depth=0
          npm ls @capacitor-community/text-to-speech --depth=0
          test -s www/voice-bridge.js
          grep -q RCTextToSpeech www/voice-bridge.js
          grep -q RCSpeechRecognition www/voice-bridge.js
          for f in va-nlu va-io va-app va-core va-ui; do test -s www/$f.js; done
          test -d node_modules/@capacitor-community/speech-recognition/android
          test -d node_modules/@capacitor-community/text-to-speech/android
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          echo "Plugins, bridge, voice modules and manifest entries are present."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RC-Trading-Journal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
